<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Mast - Master Pizzaiolo</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
        
        #camera-container { 
            position: relative; 
            flex-grow: 1; 
            width: 100vw; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }

        video { width: 100%; height: 100%; object-fit: cover; }
        
        .frame { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; object-fit: contain; z-index: 5;
        }

        /* Pannello comandi in basso */
        .controls {
            height: 140px; 
            width: 100%; 
            background: #111;
            display: flex; 
            justify-content: space-evenly; 
            align-items: center; 
            z-index: 10;
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid #333;
        }

        .btn {
            border: none; border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            cursor: pointer; transition: transform 0.1s;
            color: #000; font-weight: bold; text-transform: uppercase;
        }

        .btn:active { transform: scale(0.95); }

        /* Bottone Inversione */
        .btn-switch { width: 60px; height: 60px; background: #333; color: white; font-size: 24px; border-radius: 50%; }

        /* Bottoni Azione */
        .btn-action { width: 90px; height: 80px; font-size: 14px; letter-spacing: 1px; }
        .btn-shot { background: #fff; }
        .btn-share { background: #ffd700; } /* Oro per la condivisione */

        .btn span { margin-top: 5px; font-size: 10px; }

        canvas { display: none; }
    </style>
</head>
<body>

<div id="camera-container">
    <video id="webcam" autoplay playsinline></video>
    <img id="userFrame" src="certified.png" class="frame">
</div>

<div class="controls">
    <!-- 1. Inversione Fotocamera -->
    <button class="btn btn-switch" id="switchBtn">🔄</button>
    
    <!-- 2. Scatto con Download -->
    <button class="btn btn-action btn-shot" id="captureBtn">
        📸 <span>SHOT</span>
    </button>
    
    <!-- 3. Scatto con Condivisione -->
    <button class="btn btn-action btn-share" id="shareBtn">
        📤 <span>SHARE</span>
    </button>
</div>

<canvas id="snapshotCanvas"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('snapshotCanvas');
    const frameImg = document.getElementById('userFrame');
    const captureBtn = document.getElementById('captureBtn');
    const switchBtn = document.getElementById('switchBtn');
    const shareBtn = document.getElementById('shareBtn');

    let currentStream;
    let useFacingMode = "environment";

    async function startCamera(mode) {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: mode, width: { ideal: 3840 }, height: { ideal: 2160 } }, 
                audio: false 
            });
            currentStream = stream;
            video.srcObject = stream;
        } catch (err) {
            if(mode === "environment") startCamera("user");
        }
    }

    function createSnapshot() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');

        if (useFacingMode === "user") {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.setTransform(1, 0, 0, 1, 0, 0);

        const hRatio = canvas.width / frameImg.naturalWidth;
        const vRatio = canvas.height / frameImg.naturalHeight;
        const ratio = Math.min(hRatio, vRatio);
        const w = frameImg.naturalWidth * ratio;
        const h = frameImg.naturalHeight * ratio;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        
        ctx.drawImage(frameImg, x, y, w, h);
        return canvas.toDataURL('image/jpeg', 0.98);
    }

    // Azione SHOT
    captureBtn.addEventListener('click', () => {
        const dataUrl = createSnapshot();
        const link = document.createElement('a');
        link.download = 'omast_sorrento_master_pizzaiolo.jpeg';
        link.href = dataUrl;
        link.click();
    });

    // Azione SHARE
    shareBtn.addEventListener('click', async () => {
        const dataUrl = createSnapshot();
        const blob = await (await fetch(dataUrl)).blob();
        const file = new File([blob], 'omast_sorrento_master_pizzaiolo.jpeg', { type: 'image/jpeg' });

        if (navigator.share) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'O Mast - Master Pizzaiolo',
                    text: 'Il mio diploma certificato!'
                });
            } catch (err) { console.log("Share cancelled"); }
        } else {
            alert("Sharing not supported on this browser. Use SHOT to save.");
        }
    });

    switchBtn.addEventListener('click', () => {
        useFacingMode = (useFacingMode === "environment") ? "user" : "environment";
        startCamera(useFacingMode);
    });

    startCamera(useFacingMode);
</script>

</body>
</html>
