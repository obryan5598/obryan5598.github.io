<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Mast - Diploma</title>
    <!-- Caricamento tramite jsDelivr (spesso più sbloccato rispetto agli altri) -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 15px; text-align: center; width: 100%; max-width: 320px; border-top: 5px solid; border-image: linear-gradient(to right, #009246 33.3%, #fff 33.3%, #fff 66.6%, #ce2b37 66.6%) 1; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 16px; box-sizing: border-box; text-align: center; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        button { border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; width: 100%; }
        #downloadBtn { background: #fff; color: #000; }
        #shareBtn { background: #ffd700; color: #000; }
        #status { font-size: 11px; margin-top: 10px; color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color:#ffd700; margin:0; font-size: 20px;">DIPLOMA GENERATOR</h2>
    <div id="status">Verifica in corso...</div>
    <input type="text" id="userName" placeholder="Nome e Cognome">
    <div class="btn-group">
        <button id="downloadBtn">Download PDF</button>
        <button id="shareBtn">Share PDF</button>
    </div>
</div>

<script>
    // Sistema di controllo ultra-resistente
    function checkLibrary() {
        const status = document.getElementById('status');
        
        // Prova a trovare la libreria in tutte le sue possibili posizioni globali
        const lib = window.jspdf ? window.jspdf.jsPDF : (window.jsPDF ? window.jsPDF : null);

        if (lib) {
            status.innerText = "SISTEMA PRONTO ✅";
            status.style.color = "#009246";
            return lib;
        } else {
            status.innerHTML = "ERRORE: Sistema bloccato.<br><small>Prova a disattivare il Wi-Fi e usa il 4G/5G.</small>";
            status.style.color = "#ce2b37";
            return null;
        }
    }

    const img = new Image();
    img.src = 'template.jpg';

    async function handleAction(type) {
        const jsPDFLib = checkLibrary();
        if (!jsPDFLib) return;

        const name = document.getElementById('userName').value.trim();
        if (!name) { alert("Inserisci un nome!"); return; }

        const doc = new jsPDFLib({ orientation: 'landscape', unit: 'px', format: [1123, 794] });

        try {
            doc.addImage(img, 'JPEG', 0, 0, 1123, 794);
        } catch(e) { console.log("Immagine template non trovata."); }

        doc.setFont("times", "italic");
        doc.setFontSize(70);
        doc.text(name, 561, 420, { align: 'center' });

        const oggi = new Date().toLocaleDateString('it-IT');
        doc.setFontSize(22);
        doc.text(`Data: ${oggi}`, 150, 700);

        if (type === 'download') {
            doc.save(`diploma_${name.replace(/\s+/g, '_')}.pdf`);
        } else {
            const blob = doc.output('blob');
            const file = new File([blob], 'diploma_omast.pdf', { type: 'application/pdf' });
            if (navigator.share) {
                await navigator.share({ files: [file], title: 'Diploma O Mast' });
            } else {
                alert("Condivisione non supportata. Usa Download.");
            }
        }
    }

    // Attendi un istante per il caricamento degli script
    setTimeout(() => {
        checkLibrary();
        document.getElementById('downloadBtn').onclick = () => handleAction('download');
        document.getElementById('shareBtn').onclick = () => handleAction('share');
    }, 1000);
</script>
</body>
</html>
