<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Mast - Master Pizzaiolo</title>
    <style>
        /* Layout scuro a tutto schermo */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; display: flex; flex-direction: column; }
        
        /* Area della fotocamera e cornice */
        #camera-container { 
            position: relative; 
            flex-grow: 1; /* Occupa tutto lo spazio sopra i bottoni */
            width: 100vw; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }

        video { width: 100%; height: 100%; object-fit: cover; }
        
        .frame { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; object-fit: contain; z-index: 5;
        }

        /* Barra dei comandi SOTTO la cornice */
        .controls {
            height: 120px; /* Spazio fisso per i bottoni in basso */
            width: 100%; 
            background: #000;
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 10;
            padding-bottom: env(safe-area-inset-bottom); /* Supporto per iPhone moderni */
        }

        .btn {
            background: #fff; border: none; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }

        .btn-capture { width: 70px; height: 70px; border: 5px solid #555; }
        .btn-small { width: 50px; height: 50px; font-size: 22px; background: #333; color: white; }

        canvas { display: none; }
    </style>
</head>
<body>

<div id="camera-container">
    <video id="webcam" autoplay playsinline></video>
    <img id="userFrame" src="certified.png" class="frame">
</div>

<div class="controls">
    <button class="btn btn-small" id="switchBtn" title="Cambia Camera">🔄</button>
    <button class="btn btn-capture" id="captureBtn" title="Scatta"></button>
    <button class="btn btn-small" id="shareBtn" style="display:none;" title="Condividi">📤</button>
</div>

<canvas id="snapshotCanvas"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('snapshotCanvas');
    const frameImg = document.getElementById('userFrame');
    const captureBtn = document.getElementById('captureBtn');
    const switchBtn = document.getElementById('switchBtn');
    const shareBtn = document.getElementById('shareBtn');

    let currentStream;
    let useFacingMode = "environment";

    async function startCamera(mode) {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: mode,
                    width: { ideal: 3840 },
                    height: { ideal: 2160 }
                }, 
                audio: false 
            });
            currentStream = stream;
            video.srcObject = stream;
        } catch (err) {
            if(mode === "environment") startCamera("user");
        }
    }

    captureBtn.addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');

        if (useFacingMode === "user") {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.setTransform(1, 0, 0, 1, 0, 0);

        const hRatio = canvas.width / frameImg.naturalWidth;
        const vRatio = canvas.height / frameImg.naturalHeight;
        const ratio = Math.min(hRatio, vRatio);
        const w = frameImg.naturalWidth * ratio;
        const h = frameImg.naturalHeight * ratio;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        
        ctx.drawImage(frameImg, x, y, w, h);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.98);
        const link = document.createElement('a');
        link.download = 'omast_sorrento_master_pizzaiolo.jpeg';
        link.href = dataUrl;
        link.click();

        shareBtn.style.display = "flex";
    });

    shareBtn.addEventListener('click', async () => {
        const dataUrl = canvas.toDataURL('image/jpeg', 0.98);
        const blob = await (await fetch(dataUrl)).blob();
        const file = new File([blob], 'omast_sorrento_master_pizzaiolo.jpeg', { type: 'image/jpeg' });

        if (navigator.share) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'O Mast - Master Pizzaiolo',
                    text: 'Il mio diploma certificato!'
                });
            } catch (err) { console.log("Share failed"); }
        }
    });

    switchBtn.addEventListener('click', () => {
        useFacingMode = (useFacingMode === "environment") ? "user" : "environment";
        startCamera(useFacingMode);
    });

    startCamera(useFacingMode);
</script>

</body>
</html>
