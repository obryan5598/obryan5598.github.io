<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diploma O Mast</title>
    
    <!-- Riferimento LOCALE alla libreria appena caricata -->
    <script src="jspdf.umd.min.js"></script>

    <style>
        body { font-family: sans-serif; background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 20px; text-align: center; width: 100%; max-width: 350px; border-top: 6px solid; border-image: linear-gradient(to right, #009246 33.3%, #fff 33.3%, #fff 66.6%, #ce2b37 66.6%) 1; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        h2 { color: #ffd700; margin-bottom: 5px; }
        input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 10px; border: 1px solid #333; background: #222; color: white; font-size: 18px; text-align: center; box-sizing: border-box; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        button { border: none; padding: 16px; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 14px; transition: 0.2s; }
        #downloadBtn { background: #fff; color: #000; }
        #shareBtn { background: #ffd700; color: #000; }
        #status { font-size: 11px; margin-top: 15px; color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>MASTER PIZZAIOLO</h2>
    <div id="status">Verifica libreria locale...</div>
    <input type="text" id="userName" placeholder="Nome e Cognome">
    <div class="btn-group">
        <button id="downloadBtn">Download PDF</button>
        <button id="shareBtn">Share PDF</button>
    </div>
</div>

<script>
    let jsPDFLib = null;

    // Funzione per inizializzare la libreria caricata localmente
    function initSystem() {
        const status = document.getElementById('status');
        
        // Verifica se la libreria caricata dal file locale è disponibile
        if (window.jspdf && window.jspdf.jsPDF) {
            jsPDFLib = window.jspdf.jsPDF;
            status.innerHTML = "SISTEMA PRONTO (LOCALE) ✅";
            status.style.color = "#009246";
        } else {
            status.innerHTML = "ERRORE: File jspdf.umd.min.js non trovato nel repository.";
            status.style.color = "#ce2b37";
        }
    }

    const img = new Image();
    img.src = 'template.jpg';

    async function generate(type) {
        if (!jsPDFLib) { alert("Sistema non pronto. Verifica i file su GitHub."); return; }
        
        const name = document.getElementById('userName').value.trim();
        if (!name) { alert("Inserisci il nome!"); return; }

        const doc = new jsPDFLib({ orientation: 'landscape', unit: 'px', format: [1123, 794] });

        try {
            doc.addImage(img, 'JPEG', 0, 0, 1123, 794);
        } catch(e) { console.log("Immagine template non caricata."); }

        doc.setFont("times", "italic");
        doc.setFontSize(70);
        doc.text(name, 561, 310, { align: 'center' });

        const oggi = new Date().toLocaleDateString('it-IT');
        doc.setFontSize(60);
        doc.text(`${oggi}`, 550, 480, { align: 'center' });

        if (type === 'download') {
            doc.save('diploma_omast.pdf');
        } else {
            const blob = doc.output('blob');
            const file = new File([blob], 'diploma.pdf', { type: 'application/pdf' });
            if (navigator.share) {
                try {
                    await navigator.share({ files: [file], title: 'Diploma O Mast' });
                } catch(e) {}
            } else {
                alert("Condivisione non supportata.");
            }
        }
    }

    // Attendi un attimo per sicurezza e inizializza
    setTimeout(initSystem, 500);

    document.getElementById('downloadBtn').onclick = () => generate('download');
    document.getElementById('shareBtn').onclick = () => generate('share');
</script>

</body>
</html>
