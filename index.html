<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Mast - Master Pizzaiolo</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Adattamento alla lunghezza (altezza) come richiesto */
        .frame { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; object-fit: contain; z-index: 5;
        }

        .controls {
            position: absolute; bottom: 30px; width: 100%; 
            display: flex; justify-content: space-around; align-items: center; z-index: 10;
        }

        .btn {
            background: rgba(255,255,255,0.9); border: none; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-capture { width: 80px; height: 80px; border: 6px solid #fff; background: transparent; }
        .btn-small { width: 55px; height: 55px; font-size: 24px; }

        canvas { display: none; }
    </style>
</head>
<body>

<div id="app">
    <video id="webcam" autoplay playsinline></video>
    <!-- File rinominato in certified.png come richiesto -->
    <img id="userFrame" src="certified.png" class="frame">
    
    <div class="controls">
        <button class="btn btn-small" id="switchBtn">🔄</button>
        <button class="btn btn-capture" id="captureBtn"></button>
        <button class="btn btn-small" id="shareBtn" style="display:none;">📤</button>
    </div>
    
    <canvas id="snapshotCanvas"></canvas>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('snapshotCanvas');
    const frameImg = document.getElementById('userFrame');
    const captureBtn = document.getElementById('captureBtn');
    const switchBtn = document.getElementById('switchBtn');
    const shareBtn = document.getElementById('shareBtn');

    let currentStream;
    let useFacingMode = "environment";

    async function startCamera(mode) {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        try {
            // Richiesta massima risoluzione possibile
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: mode,
                    width: { ideal: 4096 },
                    height: { ideal: 2160 }
                }, 
                audio: false 
            });
            currentStream = stream;
            video.srcObject = stream;
        } catch (err) {
            if(mode === "environment") startCamera("user");
        }
    }

    captureBtn.addEventListener('click', () => {
        // Usa la risoluzione nativa del sensore della fotocamera
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');

        if (useFacingMode === "user") {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.setTransform(1, 0, 0, 1, 0, 0);

        // Logica per adattare alla lunghezza (altezza) dell'immagine finale
        const hRatio = canvas.width / frameImg.naturalWidth;
        const vRatio = canvas.height / frameImg.naturalHeight;
        const ratio = Math.min(hRatio, vRatio); // Adatta alla lunghezza
        const w = frameImg.naturalWidth * ratio;
        const h = frameImg.naturalHeight * ratio;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        
        ctx.drawImage(frameImg, x, y, w, h);

        // Salvataggio in JPEG alta qualità
        const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
        const fileName = 'omasto_sorrento_master_pizzaiolo.jpeg';

        const link = document.createElement('a');
        link.download = fileName;
        link.href = dataUrl;
        link.click();

        shareBtn.style.display = "flex";
    });

    shareBtn.addEventListener('click', async () => {
        const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
        const blob = await (await fetch(dataUrl)).blob();
        const file = new File([blob], 'omasto_sorrento_master_pizzaiolo.jpeg', { type: 'image/jpeg' });

        if (navigator.share) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'O Masto - Master Pizzaiolo',
                    text: 'Il mio diploma di Master Pizzaiolo!'
                });
            } catch (err) { console.log("Share failed"); }
        }
    });

    switchBtn.addEventListener('click', () => {
        useFacingMode = (useFacingMode === "environment") ? "user" : "environment";
        startCamera(useFacingMode);
    });

    startCamera(useFacingMode);
</script>

</body>
</html>
