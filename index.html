<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Mast - Diploma Generator</title>
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1a1a1a; padding: 40px 20px; border-radius: 20px; text-align: center; width: 85%; max-width: 400px; border-top: 6px solid; border-image: linear-gradient(to right, #009246 33.3%, #fff 33.3%, #fff 66.6%, #ce2b37 66.6%) 1; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        h2 { color: #ffd700; margin-bottom: 10px; letter-spacing: 1px; }
        p { color: #ccc; font-size: 14px; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #333; background: #222; color: white; font-size: 16px; box-sizing: border-box; text-align: center; }
        input:focus { outline: 2px solid #ffd700; border-color: transparent; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        button { border: none; padding: 16px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; text-transform: uppercase; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        #downloadBtn { background: #fff; color: #000; }
        #shareBtn { background: #ffd700; color: #000; }
    </style>
</head>
<body>

<div class="card">
    <h2>MASTER PIZZAIOLO</h2>
    <p>Inserisci il nome per il tuo certificato</p>
    <input type="text" id="userName" placeholder="Nome e Cognome" maxlength="30">
    <div class="btn-group">
        <button id="downloadBtn">⬇️ Download PDF</button>
        <button id="shareBtn">📤 Share Diploma</button>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;

    async function generatePDF(action) {
        const name = document.getElementById('userName').value.trim();
        if (!name) { alert("Inserisci un nome!"); return null; }

        const doc = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1123, 794] });
        const img = new Image();
        img.src = 'template.jpg'; 

        return new Promise((resolve) => {
            img.onload = async function() {
                // 1. Sfondo Diploma
                doc.addImage(img, 'JPEG', 0, 0, 1123, 794);

                // 2. Nome Elegante (Times Italic)
                doc.setFont("times", "italic");
                doc.setFontSize(70);
                doc.setTextColor(40, 40, 40);
                doc.text(name, 561, 420, { align: 'center' });

                // 3. Data Automatica
                const oggi = new Date().toLocaleDateString('it-IT');
                doc.setFontSize(22);
                doc.setFont("helvetica", "normal");
                // Posiziona la data in basso (regola 200, 700 secondo il tuo template)
                doc.text(`Data: ${oggi}`, 150, 700); 

                if (action === 'download') {
                    doc.save(`diploma_omast_${name.replace(/\s+/g, '_')}.pdf`);
                } else if (action === 'share') {
                    const pdfBlob = doc.output('blob');
                    const file = new File([pdfBlob], 'diploma_omast.pdf', { type: 'application/pdf' });
                    
                    if (navigator.share) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'O Mast - Diploma',
                                text: `Ecco il diploma di Master Pizzaiolo per ${name}!`
                            });
                        } catch (err) { console.log("Condivisione annullata"); }
                    } else {
                        alert("Condivisione non supportata su questo browser. Usa il tasto Download.");
                    }
                }
                resolve();
            };
            img.onerror = () => alert("File template.jpg non trovato nel repository!");
        });
    }

    document.getElementById('downloadBtn').addEventListener('click', () => generatePDF('download'));
    document.getElementById('shareBtn').addEventListener('click', () => generatePDF('share'));
</script>

</body>
</html>
