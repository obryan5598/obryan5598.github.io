<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Mast - Diploma</title>
    <!-- Caricamento libreria con fallback -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 15px; text-align: center; width: 85%; max-width: 320px; border-top: 5px solid gold; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 16px; box-sizing: border-box; text-align: center; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        button { border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: 0.2s; }
        #downloadBtn { background: #fff; color: #000; }
        #shareBtn { background: #ffd700; color: #000; }
        #status { font-size: 10px; margin-top: 10px; color: orange; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color:#ffd700; margin:0; font-size: 20px;">DIPLOMA GENERATOR</h2>
    <div id="status">Inizializzazione...</div>
    <input type="text" id="userName" placeholder="Nome e Cognome">
    <div class="btn-group">
        <button id="downloadBtn">Download PDF</button>
        <button id="shareBtn">Share PDF</button>
    </div>
</div>

<script>
    // 1. Controllo se la libreria è caricata
    window.onload = function() {
        const status = document.getElementById('status');
        
        if (!window.jspdf) {
            status.innerText = "ERRORE: Libreria PDF non caricata!";
            status.style.color = "red";
            return;
        }

        const { jsPDF } = window.jspdf;
        const img = new Image();
        img.src = 'template.jpg'; // Verifica che sia presente nel repo GitHub

        img.onload = () => {
            status.innerText = "Pronto per la stampa ✅";
            status.style.color = "lightgreen";
        };

        img.onerror = () => {
            status.innerText = "ATTENZIONE: template.jpg non trovato!";
            status.style.color = "yellow";
        };

        // Funzione Generazione
        async function createPDF(action) {
            const name = document.getElementById('userName').value.trim();
            if (!name) { alert("Inserisci un nome"); return; }

            const doc = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1123, 794] });
            
            // Se l'immagine è caricata la usa, altrimenti mette solo il testo
            try {
                doc.addImage(img, 'JPEG', 0, 0, 1123, 794);
            } catch(e) { console.log("Immagine non disponibile"); }

            doc.setFont("times", "italic");
            doc.setFontSize(70);
            doc.text(name, 561, 420, { align: 'center' });

            const oggi = new Date().toLocaleDateString('it-IT');
            doc.setFontSize(22);
            doc.text(`Data: ${oggi}`, 150, 700);

            if (action === 'download') {
                doc.save(`diploma_${name}.pdf`);
            } else {
                const blob = doc.output('blob');
                const file = new File([blob], 'diploma.pdf', { type: 'application/pdf' });
                if (navigator.share) {
                    await navigator.share({ files: [file], title: 'Diploma' });
                } else {
                    alert("Condivisione non supportata");
                }
            }
        }

        document.getElementById('downloadBtn').onclick = () => createPDF('download');
        document.getElementById('shareBtn').onclick = () => createPDF('share');
    };
</script>

</body>
</html>
